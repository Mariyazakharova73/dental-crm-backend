services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental_local
      POSTGRES_DB: dental_crm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
